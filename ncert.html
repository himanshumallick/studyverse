<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studyverse — Animated NCERT Solutions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #030712;
      --accent-cyan: #38bdf8;
      --accent-indigo: #6366f1;
      --accent-violet: #a855f7;
      --border-subtle: rgba(99, 102, 241, 0.25);
      --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; scroll-behavior: smooth; margin: 0; padding: 0; }
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: var(--font-sans);
      overflow-x: hidden;
      min-height: 100vh;
    }
    .spotlight-card {
      background: rgba(11, 15, 25, 0.85);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(20px);
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .spotlight-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-cyan);
      box-shadow: 0 20px 40px rgba(56, 189, 248, 0.2);
    }
    /* Scroll Connected Timeline */
    .timeline-track {
      position: absolute;
      left: 19px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
    }
    .timeline-progress {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(180deg, #38bdf8, #6366f1, #a855f7);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
      border-radius: 99px;
      transition: height 0.12s linear;
    }
    .reveal-node {
      opacity: 0;
      transform: translateY(24px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal-node.in-view {
      opacity: 1;
      transform: translateY(0);
    }
    .reveal-node .node-dot {
      transition: all 0.4s ease;
      background: #0b0f19;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }
    .reveal-node.in-view .node-dot {
      background: var(--accent-cyan);
      border-color: #fff;
      box-shadow: 0 0 16px var(--accent-cyan);
      transform: scale(1.2);
    }
    .view-section { transition: opacity 0.4s ease; }
    .hidden-view { display: none; }
  </style>
</head>
<body class="min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-[#030712]/80 backdrop-blur-xl border-b border-[rgba(99,102,241,0.25)]">
    <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3 font-extrabold text-lg">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-400 to-indigo-600 grid place-items-center text-white">⚡</div>
        STUDY<span class="text-sky-400">VERSE</span>
      </a>
      <a href="index.html" class="text-xs font-semibold px-4 py-2 rounded-xl bg-white/5 border border-white/10 hover:border-sky-400 transition">
        ← Back to Dashboard
      </a>
    </div>
  </header>

  <!-- HOME CHAPTERS VIEW -->
  <main id="homeView" class="max-w-6xl mx-auto px-6 py-12">
    <div class="text-center max-w-2xl mx-auto mb-12">
      <span class="text-xs font-bold uppercase tracking-widest text-sky-400 bg-sky-500/10 px-3 py-1 rounded-full border border-sky-400/20 inline-block mb-3">
        CBSE Class 10 • Animated Solutions
      </span>
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">Select Maths Chapter</h1>
      <p class="text-slate-400 text-sm mt-2">Click any chapter to unlock 3D animated step-by-step NCERT solutions instantly.</p>
    </div>

    <!-- Chapter Grid -->
    <div id="chaptersGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
  </main>

  <!-- READER VIEW (Scroll-Connected Timeline) -->
  <section id="readerView" class="hidden-view max-w-4xl mx-auto px-6 py-10 pb-32">
    <button onclick="goHome()" class="text-xs font-semibold text-slate-400 hover:text-sky-400 transition mb-6 inline-flex items-center gap-2">
      ← Back to Chapters
    </button>

    <div class="p-8 rounded-2xl bg-[#0b0f19] border border-[rgba(99,102,241,0.25)] shadow-xl mb-10 relative overflow-hidden">
      <span id="chBadge" class="text-xs font-mono text-sky-400 uppercase tracking-widest"></span>
      <h2 id="chTitle" class="text-2xl sm:text-3xl font-extrabold text-white mt-1"></h2>
      <p id="chDesc" class="text-slate-400 text-sm mt-2"></p>
      
      <!-- Exercise Tabs -->
      <div id="exerciseTabs" class="flex flex-wrap gap-2 mt-6 pt-5 border-t border-white/10"></div>
    </div>

    <!-- Timeline Container -->
    <div id="timelineWrapper" class="relative pl-12 sm:pl-16">
      <div class="timeline-track">
        <div id="timelineProgress" class="timeline-progress"></div>
      </div>
      <div id="questionsContainer" class="space-y-8"></div>
    </div>
  </section>

  <script>
    const MATH_CHAPTERS = [
      {
        id: "ch1",
        title: "Chapter 1: Real Numbers",
        badge: "Maths • Unit 1",
        desc: "Euclid's Division Lemma, Fundamental Theorem of Arithmetic & Irrational Proofs.",
        exercises: [
          {
            name: "Exercise 1.1",
            questions: [
              {
                qNo: "Q1",
                question: "Express each number as a product of its prime factors: (i) 140 (ii) 156",
                steps: [
                  "Step 1: Divide 140 by the smallest prime number 2 → 140 = 2 × 70.",
                  "Step 2: Further factorise 70 by 2 → 70 = 2 × 35.",
                  "Step 3: Factorise 35 by 5 → 35 = 5 × 7.",
                  "Step 4: Combine all prime divisors."
                ],
                answer: "140 = 2² × 5 × 7   |   156 = 2² × 3 × 13"
              },
              {
                qNo: "Q2",
                question: "Find LCM and HCF of 26 and 91 and verify LCM × HCF = Product of two numbers.",
                steps: [
                  "Step 1: Prime factorisation: 26 = 2 × 13 and 91 = 7 × 13.",
                  "Step 2: HCF = Common prime factor with lowest power = 13.",
                  "Step 3: LCM = Product of highest powers = 2 × 7 × 13 = 182.",
                  "Step 4: Verification: 182 × 13 = 2366 and 26 × 91 = 2366."
                ],
                answer: "HCF = 13, LCM = 182 (Verified)"
              }
            ]
          },
          {
            name: "Exercise 1.2",
            questions: [
              {
                qNo: "Q1",
                question: "Prove that √5 is irrational.",
                steps: [
                  "Step 1: Assume √5 is rational, so √5 = a/b where a and b are coprime integers (b ≠ 0).",
                  "Step 2: Squaring both sides gives a² = 5b², meaning 5 divides a² and thus 5 divides a.",
                  "Step 3: Let a = 5c. Substituting gives b² = 5c², which means 5 divides b as well.",
                  "Step 4: This contradicts our assumption that a and b are coprime."
                ],
                answer: "Hence, √5 is proved irrational."
              }
            ]
          }
        ]
      },
      {
        id: "ch2",
        title: "Chapter 2: Polynomials",
        badge: "Maths • Unit 1",
        desc: "Geometrical meaning of zeroes, relationship between zeroes and coefficients.",
        exercises: [
          {
            name: "Exercise 2.1",
            questions: [
              {
                qNo: "Q1",
                question: "Find the zeroes of the quadratic polynomial x² - 2x - 8 and verify the relationship.",
                steps: [
                  "Step 1: Split middle term: x² - 4x + 2x - 8 = 0.",
                  "Step 2: Take common terms: x(x - 4) + 2(x - 4) = 0 ⇒ (x - 4)(x + 2) = 0.",
                  "Step 3: Zeroes are x = 4 and x = -2."
                ],
                answer: "Zeroes are 4 and -2"
              }
            ]
          }
        ]
      }
    ];

    let currentChapter = null;
    let currentExIdx = 0;

    const homeView = document.getElementById("homeView");
    const readerView = document.getElementById("readerView");
    const chaptersGrid = document.getElementById("chaptersGrid");

    function renderChapters() {
      chaptersGrid.innerHTML = MATH_CHAPTERS.map(ch => `
        <div onclick="openChapter('${ch.id}')" class="spotlight-card rounded-2xl p-7 cursor-pointer flex flex-col justify-between">
          <div>
            <span class="text-xs font-mono text-sky-400 bg-sky-500/10 px-2.5 py-1 rounded-md border border-sky-400/20">${ch.badge}</span>
            <h3 class="text-xl font-bold text-white mt-4">${ch.title}</h3>
            <p class="text-slate-400 text-sm mt-2">${ch.desc}</p>
          </div>
          <div class="mt-6 pt-4 border-t border-white/5 flex items-center justify-between text-xs font-semibold text-sky-400">
            <span>Open Animated Solutions</span>
            <span>→</span>
          </div>
        </div>
      `).join("");
    }

    function openChapter(id) {
      currentChapter = MATH_CHAPTERS.find(c => c.id === id);
      currentExIdx = 0;
      document.getElementById("chBadge").textContent = currentChapter.badge;
      document.getElementById("chTitle").textContent = currentChapter.title;
      document.getElementById("chDesc").textContent = currentChapter.desc;

      renderTabs();
      renderQuestions();
      homeView.classList.add("hidden-view");
      readerView.classList.remove("hidden-view");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function goHome() {
      readerView.classList.add("hidden-view");
      homeView.classList.remove("hidden-view");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderTabs() {
      document.getElementById("exerciseTabs").innerHTML = currentChapter.exercises.map((ex, i) => `
        <button onclick="switchEx(${i})" class="px-4 py-2 rounded-xl text-xs font-semibold transition border ${
          i === currentExIdx ? "bg-sky-400 text-slate-950 border-sky-400 shadow-md" : "bg-white/5 text-slate-300 border-white/10 hover:bg-white/10"
        }">${ex.name}</button>
      `).join("");
    }

    function switchEx(i) {
      currentExIdx = i;
      renderTabs();
      renderQuestions();
    }

    function renderQuestions() {
      const ex = currentChapter.exercises[currentExIdx];
      document.getElementById("questionsContainer").innerHTML = ex.questions.map(q => `
        <article class="reveal-node relative">
          <div class="node-dot w-4 h-4 rounded-full absolute -left-[37px] sm:-left-[45px] top-6 z-10"></div>
          <div class="rounded-2xl bg-[#0b0f19] border border-[rgba(99,102,241,0.25)] p-6 sm:p-7 shadow-xl">
            <div class="flex items-start gap-3">
              <span class="px-2.5 py-1 rounded-lg bg-sky-500/15 border border-sky-400/30 text-sky-300 font-mono text-xs font-bold shrink-0">${q.qNo}</span>
              <h3 class="text-base sm:text-lg font-semibold text-white leading-snug">${q.question}</h3>
            </div>
            <div class="mt-5 space-y-3 pl-3 sm:pl-4 border-l border-sky-400/30">
              ${q.steps.map((step, s) => `
                <div class="text-sm text-slate-300 bg-white/[0.02] p-3 rounded-xl border border-white/5">
                  <span class="text-sky-400 font-mono text-xs mr-2">Step ${s+1}:</span>${step}
                </div>
              `).join("")}
            </div>
            <div class="mt-5 p-4 rounded-xl bg-gradient-to-r from-amber-500/10 to-sky-500/10 border border-amber-400/30 flex items-center gap-3">
              <span class="text-xs font-mono uppercase px-2 py-0.5 rounded bg-amber-400 text-slate-950 font-bold shrink-0">Answer</span>
              <p class="text-sm font-semibold text-amber-200">${q.answer}</p>
            </div>
          </div>
        </article>
      `).join("");
      observeNodes();
    }

    function observeNodes() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add("in-view"); });
      }, { threshold: 0.1 });
      document.querySelectorAll(".reveal-node").forEach(n => observer.observe(n));
    }

    function updateTimeline() {
      if (readerView.classList.contains("hidden-view")) return;
      const wrap = document.getElementById("timelineWrapper");
      const prog = document.getElementById("timelineProgress");
      const rect = wrap.getBoundingClientRect();
      const winH = window.innerHeight;
      const total = rect.height - winH * 0.4;
      const scrolled = Math.min(Math.max(winH * 0.5 - rect.top, 0), total);
      const pct = total > 0 ? Math.round((scrolled / total) * 100) : 100;
      prog.style.height = `${pct}%`;
    }

    window.addEventListener("scroll", updateTimeline, { passive: true });
    renderChapters();
  </script>
</body>
</html>
