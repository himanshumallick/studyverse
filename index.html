<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STUDYVERSE — Best Made for Class 10 CBSE Student</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-obsidian: #05070d;
      --bg-card: rgba(13, 19, 32, 0.78);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-gold: rgba(229, 193, 88, 0.38);
      --gold: #e5c158;
      --gold-soft: rgba(229, 193, 88, 0.14);
      --maths-blue: #3b82f6;
      --science-emerald: #10b981;
      --sst-amber: #f59e0b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: "Cormorant Garamond", Georgia, serif;
      --font-mono: "JetBrains Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-obsidian);
      background-image:
        radial-gradient(circle at 15% 18%, rgba(59, 130, 246, 0.08), transparent 45%),
        radial-gradient(circle at 80% 30%, rgba(229, 193, 88, 0.08), transparent 48%),
        radial-gradient(circle at 50% 88%, rgba(16, 185, 129, 0.07), transparent 52%);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Clean 3D Stage Canvas */
    #three-bag-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Clean Edge Vignette */
    .clean-vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(circle at 65% 45%, transparent 38%, rgba(5, 7, 13, 0.82) 100%);
    }

    /* Top Scroll Progress Indicator */
    .progress-rail {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      z-index: 80;
      background: rgba(255, 255, 255, 0.04);
    }

    .progress-bar-top {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--maths-blue), var(--gold), var(--science-emerald));
      box-shadow: 0 0 12px rgba(229, 193, 88, 0.7);
    }

    /* Side Rail Badge: BEST MADE FOR CLASS 10 CBSE STUDENT */
    .side-cbse-rail {
      position: fixed;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 45;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 14px 8px;
      border-radius: 999px;
      background: rgba(9, 13, 24, 0.72);
      border: 1px solid var(--border-gold);
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    @media (max-width: 1024px) {
      .side-cbse-rail {
        display: none;
      }
    }

    .side-rail-text {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: var(--font-mono);
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .side-rail-pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px var(--gold);
    }

    /* Opening Cinematic Curtain */
    .opening-curtain {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #04060b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cinema-bar-top,
    .cinema-bar-bottom {
      position: absolute;
      left: 0;
      right: 0;
      height: 11vh;
      background: #020306;
    }
    .cinema-bar-top { top: 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .cinema-bar-bottom { bottom: 0; border-top: 1px solid rgba(255,255,255,0.05); }

    .cinema-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(229, 193, 88, 0.18), rgba(59, 130, 246, 0.08) 48%, transparent 72%);
      filter: blur(42px);
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 10;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 24px 120px;
    }

    /* Navigation Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 22px;
      background: rgba(9, 13, 24, 0.72);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      margin-bottom: 36px;
      position: sticky;
      top: 16px;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-badge {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, #161f33, #0b101b);
      border: 1px solid var(--border-gold);
      display: grid;
      place-items: center;
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 1.3rem;
      color: var(--gold);
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
    }

    .cbse-pill {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      color: var(--gold);
      background: var(--gold-soft);
      border: 1px solid var(--border-gold);
      padding: 4px 10px;
      border-radius: 99px;
      letter-spacing: 0.06em;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-item {
      position: relative;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: color 0.25s ease;
    }

    .nav-item:hover,
    .nav-item.active {
      color: var(--text-primary);
    }

    .nav-indicator {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-gold);
      z-index: -1;
    }

    .account-btn {
      background: linear-gradient(135deg, rgba(229, 193, 88, 0.18), rgba(229, 193, 88, 0.05));
      border: 1px solid var(--border-gold);
      color: var(--gold);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 9px 16px;
      border-radius: 12px;
      cursor: pointer;
    }

    /* Hero Stage */
    .hero-grid {
      min-height: 78vh;
      display: grid;
      grid-template-columns: 1.12fr 0.88fr;
      align-items: center;
      gap: 32px;
      padding: 16px 0 64px;
    }

    @media (max-width: 920px) {
      .hero-grid {
        grid-template-columns: 1fr;
        min-height: auto;
      }
    }

    .kicker-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 18px;
    }

    .hero-h1 {
      font-size: clamp(2.5rem, 5.2vw, 4.35rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
    }

    .hero-h1 .italic-gold {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 700;
      color: var(--gold);
      font-size: 1.08em;
    }

    .hero-p {
      font-size: 1.04rem;
      line-height: 1.65;
      color: var(--text-secondary);
      max-width: 550px;
      margin-bottom: 30px;
    }

    .btn-gold {
      background: linear-gradient(135deg, #f3d06b, #c89d2c);
      color: #07090f;
      border: none;
      padding: 14px 26px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 12px 28px rgba(229, 193, 88, 0.25);
    }

    .btn-outline {
      background: rgba(13, 19, 32, 0.65);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      padding: 14px 22px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      backdrop-filter: blur(12px);
    }

    /* Interactive Bag & Reference Preview Dock */
    .bag-dock-card {
      background: rgba(10, 15, 26, 0.68);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(18px);
      border-radius: 24px;
      padding: 22px;
    }

    .ref-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 14px 0 18px;
    }

    .ref-thumb-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 10px;
      text-align: center;
    }

    .ref-thumb-box img {
      width: 100%;
      height: 86px;
      object-fit: contain;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.94);
      padding: 4px;
    }

    .ref-thumb-caption {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    .subject-switch-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .subject-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: all 0.25s ease;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .subject-row:hover {
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateX(4px);
    }

    .dot-swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      display: inline-block;
      margin-right: 10px;
    }

    /* 21st.dev Spotlight Flash Cards */
    .sec-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .sec-kicker {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--gold);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .sec-title {
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .flash-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
      gap: 18px;
      margin-bottom: 72px;
    }

    .spotlight-tile {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 24px;
      overflow: hidden;
      backdrop-filter: blur(18px);
      cursor: pointer;
    }

    .spotlight-tile::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        400px circle at var(--mx, 50%) var(--my, 50%),
        rgba(229, 193, 88, 0.15),
        transparent 45%
      );
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .spotlight-tile:hover::before {
      opacity: 1;
    }

    .spotlight-tile:hover {
      border-color: var(--border-gold);
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(16, 185, 129, 0.14);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.32);
      margin-bottom: 14px;
    }

    .badge-soon {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(148, 163, 184, 0.1);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.22);
      margin-bottom: 14px;
    }

    /* Interactive 3 Colored Books Vault */
    .vault-box {
      background: rgba(9, 13, 23, 0.84);
      border: 1px solid var(--border-subtle);
      border-radius: 28px;
      padding: 32px;
      backdrop-filter: blur(24px);
      margin-bottom: 72px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
    }

    .three-books-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }

    @media (max-width: 820px) {
      .three-books-row {
        grid-template-columns: 1fr;
      }
    }

    .colored-book-card {
      position: relative;
      border-radius: 20px;
      padding: 24px;
      text-align: left;
      cursor: pointer;
      background: rgba(15, 22, 36, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      overflow: hidden;
    }

    .book-spine-strip {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
    }

    .book-gold-corner {
      position: absolute;
      top: 10px;
      right: 12px;
      font-family: var(--font-serif);
      font-style: italic;
      color: var(--gold);
      font-size: 0.92rem;
      opacity: 0.85;
    }

    /* Chapters Grid */
    .chapters-wrap {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .chapter-card {
      background: rgba(13, 19, 32, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 18px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .chapter-card.selected {
      border-color: var(--gold);
      background: linear-gradient(145deg, rgba(229, 193, 88, 0.12), rgba(15, 23, 42, 0.96));
    }

    /* 3 Curated Videos Grid */
    .video-stage {
      background: rgba(5, 8, 15, 0.9);
      border: 1px solid var(--border-gold);
      border-radius: 22px;
      padding: 24px;
    }

    .videos-3-col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 18px;
    }

    @media (max-width: 900px) {
      .videos-3-col {
        grid-template-columns: 1fr;
      }
    }

    .video-card {
      background: rgba(14, 20, 34, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .thumb-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #0b1120;
      overflow: hidden;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .creator-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(4, 6, 12, 0.88);
      border: 1px solid rgba(229, 193, 88, 0.45);
      color: var(--gold);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
    }

    .video-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .video-footer {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .watch-btn {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--gold);
      text-decoration: none;
    }

    .watched-toggle {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-primary);
      font-size: 0.74rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .watched-toggle.done {
      background: rgba(16, 185, 129, 0.18);
      border-color: rgba(16, 185, 129, 0.45);
      color: #34d399;
    }

    /* Modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(2, 4, 10, 0.82);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      width: 100%;
      max-width: 530px;
      background: #0c111e;
      border: 1px solid var(--border-gold);
      border-radius: 24px;
      padding: 28px;
    }

    .field-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      margin-top: 6px;
      margin-bottom: 14px;
    }

    .meter-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 6px;
    }

    .meter-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.35s ease;
    }
  </style>
</head>

    function SpotlightCard({ children, onClick }) {
      const ref = useRef(null);
      const onMove = (e) => {
        if (!ref.current) return;
        const r = ref.current.getBoundingClientRect();
        ref.current.style.setProperty("--mx", `${e.clientX - r.left}px`);
        ref.current.style.setProperty("--my", `${e.clientY - r.top}px`);
      };
      return React.createElement(
        motion.div,
        {
          ref,
          onMouseMove: onMove,
          onClick,
          whileHover: { y: -5, scale: 1.01 },
          whileTap: { scale: 0.99 },
          transition: { type: "spring", stiffness: 290, damping: 24 },
          className: "spotlight-tile"
        },
        children
      );
    }

    // =========================================================================
    // THREE.JS: EYE-CATCHING 3D BAG + 3 COLORED BOOKS WITH GOLD TRIM
    // =========================================================================
    (function initClean3DBagBooks() {
      const canvas = document.getElementById("three-bag-canvas");
      if (!canvas || !window.THREE) return;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0.35, 9.6);

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      scene.add(new THREE.AmbientLight(0xffffff, 0.72));

      const goldKeyLight = new THREE.DirectionalLight(0xffe7a0, 1.45);
      goldKeyLight.position.set(5, 7, 8);
      scene.add(goldKeyLight);

      const coolRimLight = new THREE.DirectionalLight(0x60a5fa, 0.85);
      coolRimLight.position.set(-6, 2, -4);
      scene.add(coolRimLight);

      const stageGroup = new THREE.Group();
      stageGroup.position.set(2.3, -0.35, 0);
      scene.add(stageGroup);

      // Bag inspired by reference #1 (Black body + Yellow accent zip + Gold clasp)[cite: 1]
      const bagGroup = new THREE.Group();
      stageGroup.add(bagGroup);

      const blackPackMat = new THREE.MeshStandardMaterial({
        color: 0x0e131f,
        roughness: 0.45,
        metalness: 0.22
      });
      const yellowZipMat = new THREE.MeshStandardMaterial({
        color: 0xfacc15,
        roughness: 0.35,
        metalness: 0.15
      });
      const goldTrimMat = new THREE.MeshStandardMaterial({
        color: 0xe5c158,
        roughness: 0.24,
        metalness: 0.86
      });

      const packBody = new THREE.Mesh(new THREE.BoxGeometry(2.75, 3.15, 1.35), blackPackMat);
      packBody.position.y = -0.35;
      bagGroup.add(packBody);

      const frontPocket = new THREE.Mesh(new THREE.BoxGeometry(2.15, 1.4, 0.36), blackPackMat);
      frontPocket.position.set(0, -0.95, 0.78);
      bagGroup.add(frontPocket);

      const yellowAccentStrip = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.12, 0.4), yellowZipMat);
      yellowAccentStrip.position.set(0, -0.22, 0.78);
      bagGroup.add(yellowAccentStrip);

      const topGrabLoop = new THREE.Mesh(
        new THREE.TorusGeometry(0.46, 0.075, 12, 32, Math.PI),
        goldTrimMat
      );
      topGrabLoop.position.set(0, 1.22, -0.15);
      bagGroup.add(topGrabLoop);

      // 3 Colored Books with Gold Filigree Trim inspired by reference #2[cite: 2]
      function buildColoredBook(hexColor, startX) {
        const book = new THREE.Group();
        const coverMat = new THREE.MeshStandardMaterial({
          color: hexColor,
          roughness: 0.3,
          metalness: 0.22
        });
        const pageMat = new THREE.MeshStandardMaterial({
          color: 0xf8fafc,
          roughness: 0.75
        });

        const front = new THREE.Mesh(new THREE.BoxGeometry(1.52, 2.08, 0.08), coverMat);
        front.position.z = 0.16;

        const back = new THREE.Mesh(new THREE.BoxGeometry(1.52, 2.08, 0.08), coverMat);
        back.position.z = -0.16;

        const spine = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.08, 0.38), coverMat);
        spine.position.x = -0.73;

        const goldBorderTop = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.03, 0.09), goldTrimMat);
        goldBorderTop.position.set(0.05, 0.85, 0.2);

        const goldBorderBottom = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.03, 0.09), goldTrimMat);
        goldBorderBottom.position.set(0.05, -0.85, 0.2);

        const pages = new THREE.Mesh(new THREE.BoxGeometry(1.44, 1.98, 0.26), pageMat);

        book.add(front, back, spine, goldBorderTop, goldBorderBottom, pages);
        book.position.set(startX, 0.15, 0);
        return book;
      }

      const subjectBooks = {
        maths: buildColoredBook(0x3b82f6, -0.55),
        science: buildColoredBook(0x10b981, 0.0),
        sst: buildColoredBook(0xf59e0b, 0.55)
      };

      Object.values(subjectBooks).forEach((b) => stageGroup.add(b));

      window.__BAG_SCROLL__ = 0;
      window.__ACTIVE_BOOK__ = "maths";

      const clock = new THREE.Clock();

      function renderLoop() {
        requestAnimationFrame(renderLoop);
        const elapsed = clock.getElapsedTime();
        const scrollVal = window.__BAG_SCROLL__ || 0;
        const selectedKey = window.__ACTIVE_BOOK__ || "maths";

        const isCompact = window.innerWidth < 920;
        stageGroup.position.x = isCompact
          ? 0
          : THREE.MathUtils.lerp(2.35, 0, Math.min(scrollVal * 1.6, 1));
        stageGroup.position.y = isCompact ? -1.4 : -0.3;
        stageGroup.scale.setScalar(isCompact ? 0.72 : 1);

        stageGroup.rotation.y = Math.sin(elapsed * 0.45) * 0.22 + scrollVal * 0.55;
        stageGroup.rotation.x = Math.cos(elapsed * 0.35) * 0.05;

        const emergeFactor = Math.min(scrollVal * 2.4, 1);

        const targets = [
          {
            key: "maths",
            x: -0.55 - emergeFactor * 1.5,
            y: 0.15 + emergeFactor * 1.6,
            zRot: 0.12 + emergeFactor * 0.16
          },
          {
            key: "science",
            x: 0,
            y: 0.22 + emergeFactor * 1.9,
            zRot: 0
          },
          {
            key: "sst",
            x: 0.55 + emergeFactor * 1.5,
            y: 0.15 + emergeFactor * 1.6,
            zRot: -0.12 - emergeFactor * 0.16
          }
        ];

        targets.forEach(({ key, x, y, zRot }) => {
          const mesh = subjectBooks[key];
          const isCurrent = key === selectedKey;
          const lift = isCurrent ? 0.35 : 0;

          mesh.position.x = THREE.MathUtils.lerp(mesh.position.x, x, 0.08);
          mesh.position.y = THREE.MathUtils.lerp(mesh.position.y, y + lift, 0.08);
          mesh.position.z = THREE.MathUtils.lerp(mesh.position.z, isCurrent ? 0.55 : 0.05, 0.08);
          mesh.rotation.z = THREE.MathUtils.lerp(mesh.rotation.z, zRot, 0.08);
          mesh.rotation.y = isCurrent ? Math.sin(elapsed * 1.4) * 0.22 : 0;
        });

        renderer.render(scene, camera);
      }

      renderLoop();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();
  </script>
