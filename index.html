  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  />

  <style>
    :root {
      --bg: #02050d;
      --surface: rgba(9, 14, 26, 0.84);
      --border: rgba(99, 102, 241, 0.28);
      --cyan: #38bdf8;
      --indigo: #6366f1;
      --violet: #a855f7;
      --amber: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --font-sans: "Plus Jakarta Sans", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Fullscreen 3D Books + Laptops Canvas */
    #three-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Film letterbox top/bottom subtle bars + scroll cinema bar */
    .cinema-top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      z-index: 70;
      background: rgba(255, 255, 255, 0.05);
      pointer-events: none;
    }

    .cinema-top-fill {
      height: 100%;
      width: 100%;
      transform-origin: 0% 50%;
      background: linear-gradient(90deg, var(--cyan), var(--indigo), var(--violet), var(--amber));
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.7);
    }

    .page-wrap {
      position: relative;
      z-index: 10;
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 20px 110px;
    }

    /* Opening Cinema Curtain Overlay */
    .opening-curtain {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: radial-gradient(circle at 50% 45%, #0f172a, #02050d 75%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
    }

    .intro-code {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      color: var(--cyan);
      text-transform: uppercase;
    }

    .intro-logo {
      font-size: clamp(2.4rem, 6vw, 4.4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .grad {
      background: linear-gradient(135deg, var(--cyan), #818cf8, var(--violet));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 18px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(2, 5, 13, 0.55);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 14px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.25rem;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--cyan), var(--indigo));
      color: #fff;
    }

    .brand span {
      color: var(--cyan);
    }

    .nav-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-step {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      padding: 7px 12px;
      border-radius: 99px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(15, 23, 42, 0.65);
      color: var(--muted);
      cursor: pointer;
    }

    .nav-step.active {
      color: #fff;
      border-color: var(--cyan);
      background: rgba(56, 189, 248, 0.16);
    }

    /* Scene 1: Hero + Flash Cards + Explore Classes */
    .hero-cinema {
      min-height: 76vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 22px;
      margin-bottom: 48px;
    }

    .hero-heading {
      font-size: clamp(2.3rem, 5.2vw, 4.1rem);
      font-weight: 800;
      line-height: 1.08;
      max-width: 880px;
    }

    .hero-sub {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 680px;
      line-height: 1.6;
    }

    .cta-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-explore {
      background: linear-gradient(135deg, var(--cyan), var(--indigo));
      color: #fff;
      border: none;
      padding: 14px 24px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 14px 32px rgba(56, 189, 248, 0.28);
    }

    .btn-secondary {
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      border: 1px solid rgba(148, 163, 184, 0.28);
      padding: 13px 20px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* 3D Flash Cards Strip */
    .flashcards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 12px;
    }

    .flash-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(18px);
      cursor: pointer;
      transform-style: preserve-3d;
    }

    .flash-tag {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--cyan);
      margin-bottom: 8px;
      display: block;
    }

    .flash-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
    }

    .flash-copy {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.45;
    }

    /* Stage Panels */
    .stage-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 26px;
      backdrop-filter: blur(22px);
      margin-bottom: 36px;
    }

    .stage-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .cards-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .hub-card {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 20px;
      padding: 22px;
      cursor: pointer;
      text-align: left;
      color: var(--text);
    }

    .hub-card.active,
    .hub-card:hover {
      border-color: var(--cyan);
      box-shadow: 0 14px 32px rgba(56, 189, 248, 0.16);
    }

    .chapter-box {
      background: rgba(2, 5, 13, 0.68);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .chapter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .mod-code {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--cyan);
      font-weight: 700;
    }

    .chapter-name {
      font-size: 1.06rem;
      font-weight: 800;
      color: #fff;
      margin-top: 2px;
    }

    .ncert-badge {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: #fde68a;
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 6px 12px;
      border-radius: 99px;
    }

    .videos-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }

    .vid-card {
      background: rgba(9, 14, 26, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }

    .vid-thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #0f172a;
      overflow: hidden;
    }

    .vid-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .vid-card:hover .vid-thumb img {
      transform: scale(1.06);
    }

    .vid-rank {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(2, 5, 13, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.5);
      color: var(--cyan);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 99px;
    }

    .vid-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .vid-title {
      font-size: 0.86rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.35;
    }

    .vid-sub {
      font-size: 0.74rem;
      color: var(--muted);
      margin-top: auto;
    }
  </style>
</head>

    function initThreeCinema() {
      const canvas = document.getElementById("three-scene");
      if (!canvas || !window.THREE) return;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 8);

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const world = new THREE.Group();
      scene.add(world);

      // Build stylized 3D Book mesh (cover + pages)
      function make3DBook(accentHex) {
        const book = new THREE.Group();
        const coverMat = new THREE.MeshStandardMaterial({
          color: accentHex,
          roughness: 0.35,
          metalness: 0.55
        });
        const pageMat = new THREE.MeshStandardMaterial({
          color: 0xe2e8f0,
          roughness: 0.8
        });
        const cover = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.75, 0.24), coverMat);
        const pages = new THREE.Mesh(new THREE.BoxGeometry(1.18, 1.62, 0.18), pageMat);
        pages.position.x = 0.05;
        book.add(cover, pages);
        return book;
      }

      // Build stylized 3D Laptop mesh (base + screen)
      function make3DLaptop(accentHex) {
        const laptop = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({
          color: 0x1e293b,
          roughness: 0.3,
          metalness: 0.85
        });
        const screenGlowMat = new THREE.MeshStandardMaterial({
          color: accentHex,
          emissive: accentHex,
          emissiveIntensity: 0.45,
          roughness: 0.25
        });
        const base = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.1, 1.3), bodyMat);
        const screenFrame = new THREE.Mesh(new THREE.BoxGeometry(1.9, 1.2, 0.08), bodyMat);
        const screenPanel = new THREE.Mesh(new THREE.PlaneGeometry(1.72, 1.02), screenGlowMat);

        screenFrame.position.set(0, 0.62, -0.58);
        screenFrame.rotation.x = -0.25;
        screenPanel.position.set(0, 0.62, -0.535);
        screenPanel.rotation.x = -0.25;

        laptop.add(base, screenFrame, screenPanel);
        return laptop;
      }

      const props = [];
      const palette = [0x38bdf8, 0x6366f1, 0xa855f7];

      for (let i = 0; i < 4; i++) {
        const b = make3DBook(palette[i % palette.length]);
        b.position.set(-4.2 + i * 2.8, (i % 2 === 0 ? 1.8 : -1.9), -1.5 - i * 0.8);
        b.rotation.set(0.3, 0.5 * i, 0.15);
        world.add(b);
        props.push({ mesh: b, kind: "book", speed: 0.004 + i * 0.001, baseY: b.position.y });
      }

      for (let j = 0; j < 3; j++) {
        const l = make3DLaptop(palette[(j + 1) % palette.length]);
        l.position.set(3.8 - j * 3.4, (j % 2 === 0 ? -1.4 : 2.1), -0.8 - j * 1.1);
        l.rotation.set(0.28, -0.45 * (j + 1), 0.1);
        world.add(l);
        props.push({ mesh: l, kind: "laptop", speed: 0.003 + j * 0.001, baseY: l.position.y });
      }

      scene.add(new THREE.AmbientLight(0xffffff, 1.2));
      const keyLight = new THREE.PointLight(0x38bdf8, 3.2, 40);
      keyLight.position.set(5, 6, 7);
      const rimLight = new THREE.PointLight(0xa855f7, 2.5, 40);
      rimLight.position.set(-6, -4, 6);
      scene.add(keyLight, rimLight);

      let scrollNorm = 0;
      const fillEl = document.getElementById("cinemaProgress");

      const onScroll = () => {
        const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        scrollNorm = Math.min(1, Math.max(0, window.scrollY / maxScroll));
        if (fillEl) fillEl.style.transform = `scaleX(${scrollNorm})`;
      };

      window.addEventListener("scroll", onScroll, { passive: true });
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      let rafId;
      const tick = (t) => {
        rafId = requestAnimationFrame(tick);
        // Film-like camera sweep driven by scroll progress
        camera.position.x = Math.sin(scrollNorm * Math.PI * 1.5) * 1.6;
        camera.position.y = (0.5 - scrollNorm) * 2.2;
        camera.position.z = 8 - scrollNorm * 2.1;
        camera.lookAt(0, 0, -1);

        props.forEach((p, idx) => {
          p.mesh.rotation.y += p.speed + scrollNorm * 0.012;
          p.mesh.rotation.x += p.speed * 0.6;
          p.mesh.position.y = p.baseY + Math.sin(t * 0.0012 + idx) * 0.25 - scrollNorm * 1.4;
        });

        renderer.render(scene, camera);
      };
      tick(0);

      return () => {
        cancelAnimationFrame(rafId);
        window.removeEventListener("scroll", onScroll);
      };
    }

    function CinemaApp() {
      const [introDone, setIntroDone] = useState(false);
      const [stage, setStage] = useState("home"); // "home" | "classes" | "subjects" | "syllabus"
      const [selectedClass, setSelectedClass] = useState("class10");
      const [selectedStream, setSelectedStream] = useState("pcm");
      const [selectedSubject, setSelectedSubject] = useState("science");

      const classesSectionRef = useRef(null);
      const subjectsSectionRef = useRef(null);
      const syllabusSectionRef = useRef(null);

      useEffect(() => {
        const cleanup = initThreeCinema();
        const timer = setTimeout(() => setIntroDone(true), 1250);
        return () => {
          clearTimeout(timer);
          if (cleanup) cleanup();
        };
      }, []);

      const scrollToRef = (ref) => {
        setTimeout(() => {
          ref.current?.scrollIntoView({ behavior: "smooth", block: "start" });
        }, 80);
      };

      const handleExploreClasses = () => {
        setStage("classes");
        scrollToRef(classesSectionRef);
      };

      const handleSelectClass = (clsKey) => {
        setSelectedClass(clsKey);
        setStage("subjects");
        const subMap =
          clsKey === "class12"
            ? NCERT_HUB.class12.streams[selectedStream].subjects
            : NCERT_HUB[clsKey].subjects;
        setSelectedSubject(Object.keys(subMap)[0]);
        scrollToRef(subjectsSectionRef);
      };

      const handleSelectStream = (streamKey) => {
        setSelectedStream(streamKey);
        const firstSub = Object.keys(NCERT_HUB.class12.streams[streamKey].subjects)[0];
        setSelectedSubject(firstSub);
        setStage("syllabus");
        scrollToRef(syllabusSectionRef);
      };

      const handleSelectSubject = (subKey) => {
        setSelectedSubject(subKey);
        setStage("syllabus");
        scrollToRef(syllabusSectionRef);
      };

      const currentClassData = NCERT_HUB[selectedClass];
      const subjectsMap =
        selectedClass === "class12"
          ? currentClassData.streams[selectedStream].subjects
          : currentClassData.subjects;
      const activeSubKey = subjectsMap[selectedSubject] ? selectedSubject : Object.keys(subjectsMap)[0];
      const activeSubData = subjectsMap[activeSubKey];

      return React.createElement(
        React.Fragment,
        null,

        // Opening Cinema Curtain
        React.createElement(
          AnimatePresence,
          null,
          !introDone &&
            React.createElement(
              motion.div,
              {
                key: "intro-curtain",
                initial: { opacity: 1 },
                exit: { opacity: 0, y: -40, scale: 1.03 },
                transition: { duration: 0.65, ease: [0.22, 1, 0.36, 1] },
                className: "opening-curtain"
              },
              React.createElement("div", { className: "intro-code" }, "OPENING REEL • CBSE 9–12"),
              React.createElement(
                motion.div,
                {
                  initial: { scale: 0.88, opacity: 0 },
                  animate: { scale: 1, opacity: 1 },
                  transition: { duration: 0.55 },
                  className: "intro-logo"
                },
                "STUDY",
                React.createElement("span", { className: "grad" }, "VERSE")
              ),
              React.createElement(
                "button",
                {
                  type: "button",
                  className: "btn-secondary",
                  onClick: () => setIntroDone(true)
                },
                "Skip Intro →"
              )
            )
        ),

        React.createElement(
          "div",
          { className: "page-wrap" },

          // Top Navigation Bar across flow stages
          React.createElement(
            "header",
            { className: "header-bar" },
            React.createElement(
              "div",
              {
                className: "brand",
                style: { cursor: "pointer" },
                onClick: () => {
                  setStage("home");
                  window.scrollTo({ top: 0, behavior: "smooth" });
                }
              },
              React.createElement("div", { className: "brand-icon" }, "⚡"),
              React.createElement("div", null, "STUDY", React.createElement("span", null, "VERSE"))
            ),
            React.createElement(
              "div",
              { className: "nav-pills" },
              [
                { id: "home", label: "01 Flash & Intro" },
                { id: "classes", label: "02 Classes" },
                { id: "subjects", label: "03 Subjects" },
                { id: "syllabus", label: "04 NCERT & Top Videos" }
              ].map((step) =>
                React.createElement(
                  "button",
                  {
                    key: step.id,
                    type: "button",
                    onClick: () => setStage(step.id),
                    className: `nav-step ${stage === step.id ? "active" : ""}`
                  },
                  step.label
                )
              )
            )
          ),

          // Scene 1: Opening Hero + 3D Flash Cards + Explore Classes
          React.createElement(
            motion.section,
            {
              initial: { opacity: 0, y: 24 },
              animate: { opacity: 1, y: 0 },
              transition: { duration: 0.7, ease: [0.22, 1, 0.36, 1] },
              className: "hero-cinema"
            },
            React.createElement(
              "div",
              { className: "mod-code" },
              "CINEMATIC 3D STAGE • BOOKS & LAPTOPS IN SCROLL MOTION"
            ),
            React.createElement(
              "h1",
              { className: "hero-heading" },
              "Ek Film Jaisa ",
              React.createElement("span", { className: "grad" }, "CBSE Learning Hub"),
              " — Classes 9 se 12 Tak"
            ),
            React.createElement(
              "p",
              { className: "hero-sub" },
              "Pehle Flash Cards dekhein, phir Explore Classes se apni Class aur Stream chunein, Subject kholein, aur New NCERT syllabus ke saath top 2–3 rated CBSE videos dekhein."
            ),
            React.createElement(
              "div",
              { className: "cta-row" },
              React.createElement(
                motion.button,
                {
                  type: "button",
                  whileHover: { scale: 1.03 },
                  whileTap: { scale: 0.97 },
                  onClick: handleExploreClasses,
                  className: "btn-explore"
                },
                "Explore Classes →"
              ),
              React.createElement(
                "button",
                {
                  type: "button",
                  onClick: () => {
                    setStage("classes");
                    scrollToRef(classesSectionRef);
                  },
                  className: "btn-secondary"
                },
                "Jump to Class 9–12"
              )
            ),

            // Flash Cards
            React.createElement(
              "div",
              { className: "flashcards-grid" },
              FLASH_CARDS.map((fc, i) =>
                React.createElement(
                  motion.div,
                  {
                    key: fc.tag,
                    initial: { opacity: 0, y: 22 },
                    whileInView: { opacity: 1, y: 0 },
                    viewport: { once: true, amount: 0.2 },
                    transition: { delay: i * 0.08, duration: 0.55 },
                    whileHover: { y: -8, rotateX: 3, rotateY: -3 },
                    onClick: handleExploreClasses,
                    className: "flash-card"
                  },
                  React.createElement("span", { className: "flash-tag" }, fc.tag),
                  React.createElement("div", { className: "flash-title" }, fc.title),
                  React.createElement("div", { className: "flash-copy" }, fc.copy)
                )
              )
            )
          ),

          // Scene 2: Classes Explorer (9, 10, 11, 12)
          React.createElement(
            motion.section,
            {
              ref: classesSectionRef,
              initial: { opacity: 0, y: 28 },
              whileInView: { opacity: 1, y: 0 },
              viewport: { once: true, amount: 0.15 },
              transition: { duration: 0.65 },
              className: "stage-panel"
            },
            React.createElement(
              "div",
              { className: "stage-head" },
              React.createElement(
                "div",
                null,
                React.createElement("div", { className: "mod-code" }, "STEP 02 • EXPLORE CLASSES"),
                React.createElement("h2", { style: { fontSize: "1.5rem", fontWeight: 800, marginTop: "4px" } }, "Apni Class Chunein")
              ),
              React.createElement("span", { className: "ncert-badge" }, "3D SCROLL ACTIVE")
            ),
            React.createElement(
              "div",
              { className: "cards-4" },
              Object.entries(NCERT_HUB).map(([clsKey, clsVal], idx) =>
                React.createElement(
                  motion.button,
                  {
                    key: clsKey,
                    type: "button",
                    initial: { opacity: 0, y: 18 },
                    whileInView: { opacity: 1, y: 0 },
                    viewport: { once: true, amount: 0.2 },
                    transition: { delay: idx * 0.06 },
                    whileHover: { y: -6, scale: 1.02 },
                    whileTap: { scale: 0.98 },
                    onClick: () => handleSelectClass(clsKey),
                    className: `hub-card ${selectedClass === clsKey ? "active" : ""}`
                  },
                  React.createElement("div", { className: "mod-code" }, clsVal.badge),
                  React.createElement("div", { style: { fontSize: "1.35rem", fontWeight: 800, margin: "8px 0 6px" } }, clsVal.label),
                  React.createElement("div", { style: { fontSize: "0.82rem", color: "#94a3b8" } }, "Subjects & New NCERT Chapters →")
                )
              )
            )
          ),

          // Scene 3: Stream (if Class 12) + Subjects Explorer
          React.createElement(
            motion.section,
            {
              ref: subjectsSectionRef,
              initial: { opacity: 0, y: 28 },
              whileInView: { opacity: 1, y: 0 },
              viewport: { once: true, amount: 0.15 },
              transition: { duration: 0.65 },
              className: "stage-panel"
            },
            React.createElement(
              "div",
              { className: "stage-head" },
              React.createElement(
                "div",
                null,
                React.createElement("div", { className: "mod-code" }, `STEP 03 • ${currentClassData.label.toUpperCase()} SUBJECTS`),
                React.createElement(
                  "h2",
                  { style: { fontSize: "1.5rem", fontWeight: 800, marginTop: "4px" } },
                  selectedClass === "class12"
                    ? `Class 12 (${NCERT_HUB.class12.streams[selectedStream].label}) — Stream & Subjects`
                    : `${currentClassData.label} — Subjects`
                )
              )
            ),

            // Class 12 Stream Switcher
            selectedClass === "class12" &&
              React.createElement(
                "div",
                { style: { display: "flex", gap: "10px", flexWrap: "wrap", marginBottom: "18px" } },
                Object.entries(NCERT_HUB.class12.streams).map(([sKey, sVal]) =>
                  React.createElement(
                    motion.button,
                    {
                      key: sKey,
                      type: "button",
                      whileHover: { y: -2 },
                      whileTap: { scale: 0.97 },
                      onClick: () => handleSelectStream(sKey),
                      className: `nav-step ${selectedStream === sKey ? "active" : ""}`
                    },
                    sVal.label
                  )
                )
              ),

            React.createElement(
              "div",
              { className: "cards-4" },
              Object.entries(subjectsMap).map(([subKey, subVal], idx) =>
                React.createElement(
                  motion.button,
                  {
                    key: subKey,
                    type: "button",
                    initial: { opacity: 0, y: 16 },
                    whileInView: { opacity: 1, y: 0 },
                    viewport: { once: true, amount: 0.2 },
                    transition: { delay: idx * 0.06 },
                    whileHover: { y: -5, scale: 1.02 },
                    whileTap: { scale: 0.98 },
                    onClick: () => handleSelectSubject(subKey),
                    className: `hub-card ${activeSubKey === subKey ? "active" : ""}`
                  },
                  React.createElement("div", { style: { fontSize: "1.7rem", marginBottom: "8px" } }, subVal.icon),
                  React.createElement("div", { style: { fontSize: "1.15rem", fontWeight: 800 } }, subVal.label),
                  React.createElement(
                    "div",
                    { style: { fontSize: "0.8rem", color: "#94a3b8", marginTop: "4px" } },
                    `${subVal.chapters.length} Chapters Loaded →`
                  )
                )
              )
            )
          ),

          // Scene 4: New NCERT Syllabus Chapters + Top 2-3 Rated Videos with Thumbnails
          React.createElement(
            motion.section,
            {
              ref: syllabusSectionRef,
              initial: { opacity: 0, y: 28 },
              whileInView: { opacity: 1, y: 0 },
              viewport: { once: true, amount: 0.1 },
              transition: { duration: 0.65 },
              className: "stage-panel"
            },
            React.createElement(
              "div",
              { className: "stage-head" },
              React.createElement(
                "div",
                null,
                React.createElement("div", { className: "mod-code" }, "STEP 04 • NEW NCERT SYLLABUS & TOP VIDEOS"),
                React.createElement(
                  "h2",
                  { style: { fontSize: "1.5rem", fontWeight: 800, marginTop: "4px" } },
                  `${currentClassData.label}${selectedClass === "class12" ? ` (${NCERT_HUB.class12.streams[selectedStream].label})` : ""} • ${activeSubData.label}`
                )
              ),
              React.createElement("span", { className: "ncert-badge" }, "TOP 2–3 RATED CBSE PICKS")
            ),

            activeSubData.chapters.map((ch, cIdx) =>
              React.createElement(
                motion.div,
                {
                  key: ch.id,
                  initial: { opacity: 0, y: 20 },
                  whileInView: { opacity: 1, y: 0 },
                  viewport: { once: true, amount: 0.15 },
                  transition: { delay: cIdx * 0.06, duration: 0.5 },
                  className: "chapter-box"
                },
                React.createElement(
                  "div",
                  { className: "chapter-header" },
                  React.createElement(
                    "div",
                    null,
                    React.createElement("div", { className: "mod-code" }, `CHAPTER 0${cIdx + 1}`),
                    React.createElement("div", { className: "chapter-name" }, ch.name)
                  ),
                  React.createElement("span", { className: "ncert-badge" }, ch.ncertTag)
                ),

                React.createElement(
                  "div",
                  { className: "videos-row" },
                  ch.videos.slice(0, 3).map((vid, vIdx) =>
                    React.createElement(
                      motion.a,
                      {
                        key: `${ch.id}-${vid.videoId}`,
                        href: vid.url,
                        target: "_blank",
                        rel: "noopener noreferrer",
                        initial: { opacity: 0, scale: 0.97 },
                        whileInView: { opacity: 1, scale: 1 },
                        viewport: { once: true, amount: 0.15 },
                        transition: { delay: vIdx * 0.05 },
                        whileHover: { y: -6, scale: 1.015 },
                        whileTap: { scale: 0.98 },
                        className: "vid-card"
                      },
                      React.createElement(
                        "div",
                        { className: "vid-thumb" },
                        React.createElement("img", {
                          src: `https://img.youtube.com/vi/${vid.videoId}/hqdefault.jpg`,
                          alt: vid.title,
                          loading: "lazy"
                        }),
                        React.createElement("span", { className: "vid-rank" }, vid.rank)
                      ),
                      React.createElement(
                        "div",
                        { className: "vid-info" },
                        React.createElement("div", { className: "vid-title" }, vid.title),
                        React.createElement("div", { className: "vid-sub" }, `${vid.channel} • ${vid.year}`)
                      )
                    )
                  )
                )
              )
            )
          )
        )
      );
    }

    createRoot(document.getElementById("root")).render(React.createElement(CinemaApp));
  </script>
</body>
</html>
