<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STUDYVERSE — CBSE Class 10</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-obsidian: #05070d;
      --bg-card: rgba(12, 18, 30, 0.78);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-gold: rgba(229, 193, 88, 0.36);
      --gold: #e5c158;
      --gold-soft: rgba(229, 193, 88, 0.14);
      --maths-color: #3b82f6;
      --science-color: #10b981;
      --sst-color: #f59e0b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: "Cormorant Garamond", Georgia, serif;
      --font-mono: "JetBrains Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-obsidian);
      background-image:
        radial-gradient(circle at 20% 18%, rgba(59, 130, 246, 0.07), transparent 44%),
        radial-gradient(circle at 80% 24%, rgba(229, 193, 88, 0.08), transparent 46%),
        radial-gradient(circle at 50% 85%, rgba(16, 185, 129, 0.06), transparent 50%);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Clean Fullscreen 3D Canvas */
    #three-center-stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Clean Subtle Vignette */
    .stage-vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, transparent 36%, rgba(5, 7, 13, 0.84) 100%);
    }

    /* Top Scroll Progress Line */
    .scroll-track {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      z-index: 80;
      background: rgba(255, 255, 255, 0.04);
    }

    .scroll-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--maths-color), var(--gold), var(--science-color));
      box-shadow: 0 0 12px rgba(229, 193, 88, 0.65);
    }

    /* Side Rail Label: BEST MADE FOR CLASS 10 CBSE STUDENT */
    .side-badge {
      position: fixed;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 45;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 14px 8px;
      border-radius: 999px;
      background: rgba(9, 13, 24, 0.72);
      border: 1px solid var(--border-gold);
      backdrop-filter: blur(16px);
    }

    @media (max-width: 1024px) {
      .side-badge {
        display: none;
      }
    }

    .side-badge-text {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-family: var(--font-mono);
      font-size: 0.63rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .side-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold);
    }

    /* Layout Container */
    .page-container {
      position: relative;
      z-index: 10;
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px 22px 120px;
    }

    /* Top Navigation Bar */
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 13px 20px;
      background: rgba(9, 13, 24, 0.74);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      margin-bottom: 28px;
      position: sticky;
      top: 14px;
      z-index: 50;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
    }

    .brand-logo-box {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #172036, #0a0f1a);
      border: 1px solid var(--border-gold);
      display: grid;
      place-items: center;
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--gold);
    }

    .brand-name {
      font-weight: 800;
      font-size: 1.12rem;
      letter-spacing: 0.04em;
    }

    .class-chip {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      color: var(--gold);
      background: var(--gold-soft);
      border: 1px solid var(--border-gold);
      padding: 3px 9px;
      border-radius: 99px;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-link-btn {
      position: relative;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 0.84rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: color 0.25s ease;
    }

    .nav-link-btn:hover,
    .nav-link-btn.active {
      color: var(--text-primary);
    }

    .nav-pill-bg {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-gold);
      z-index: -1;
    }

    .auth-action-btn {
      background: linear-gradient(135deg, rgba(229, 193, 88, 0.18), rgba(229, 193, 88, 0.05));
      border: 1px solid var(--border-gold);
      color: var(--gold);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 9px 15px;
      border-radius: 12px;
      cursor: pointer;
    }

    /* Centerpiece Hero with Bag in Middle */
    .center-hero {
      min-height: 76vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      padding: 18px 0 42px;
    }

    .hero-top-copy {
      max-width: 720px;
      z-index: 2;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }

    .hero-headline {
      font-size: clamp(2.4rem, 5.2vw, 4.1rem);
      font-weight: 800;
      line-height: 1.06;
      letter-spacing: -0.03em;
      margin-bottom: 14px;
    }

    .hero-headline .gold-serif {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 700;
      color: var(--gold);
      font-size: 1.08em;
    }

    .hero-subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: 560px;
      margin: 0 auto;
    }

    /* Middle Interactive Bag & Reference Strip */
    .middle-bag-dock {
      margin-top: 26px;
      background: rgba(9, 14, 25, 0.72);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(18px);
      border-radius: 22px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      z-index: 2;
    }

    .mini-ref-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mini-ref-img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.94);
      padding: 3px;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .scroll-cue-btn {
      background: linear-gradient(135deg, #f3d06b, #c89d2c);
      color: #07090f;
      border: none;
      padding: 11px 20px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(229, 193, 88, 0.24);
    }

    /* 21st.dev Spotlight Cards (More Features Coming Soon + Videos Live) */
    .section-block {
      margin-bottom: 76px;
    }

    .sec-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }

    .sec-tag {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--gold);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .sec-heading {
      font-size: clamp(1.55rem, 3vw, 2.15rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .spotlight-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }

    .spotlight-box {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 22px;
      overflow: hidden;
      backdrop-filter: blur(18px);
      cursor: pointer;
    }

    .spotlight-box::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        380px circle at var(--x, 50%) var(--y, 50%),
        rgba(229, 193, 88, 0.15),
        transparent 46%
      );
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .spotlight-box:hover::before {
      opacity: 1;
    }

    .spotlight-box:hover {
      border-color: var(--border-gold);
    }

    .pill-live {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
      margin-bottom: 12px;
    }

    .pill-soon {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(148, 163, 184, 0.1);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.22);
      margin-bottom: 12px;
    }

    /* 3 Books Emerged From Bag -> Chapters -> 3 Videos */
    .bag-books-panel {
      background: rgba(9, 13, 23, 0.84);
      border: 1px solid var(--border-subtle);
      border-radius: 28px;
      padding: 30px;
      backdrop-filter: blur(22px);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
    }

    .books-3-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    @media (max-width: 820px) {
      .books-3-grid {
        grid-template-columns: 1fr;
      }
    }

    .subject-book-btn {
      position: relative;
      border-radius: 20px;
      padding: 24px;
      text-align: left;
      cursor: pointer;
      background: rgba(15, 22, 36, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      overflow: hidden;
    }

    .left-color-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
    }

    .chapters-reveal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 14px;
      margin-bottom: 26px;
    }

    .chapter-tile {
      background: rgba(13, 19, 32, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 18px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .chapter-tile.active-ch {
      border-color: var(--gold);
      background: linear-gradient(145deg, rgba(229, 193, 88, 0.13), rgba(15, 23, 42, 0.96));
    }

    .videos-panel {
      background: rgba(5, 8, 15, 0.92);
      border: 1px solid var(--border-gold);
      border-radius: 22px;
      padding: 24px;
    }

    .videos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 18px;
    }

    @media (max-width: 900px) {
      .videos-grid {
        grid-template-columns: 1fr;
      }
    }

    .vid-card {
      background: rgba(14, 20, 34, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .vid-thumb-box {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #0b1120;
      overflow: hidden;
    }

    .vid-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .vid-channel-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(4, 6, 12, 0.88);
      border: 1px solid rgba(229, 193, 88, 0.45);
      color: var(--gold);
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
    }

    .vid-card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .vid-card-foot {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .yt-link {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--gold);
      text-decoration: none;
    }

    .done-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-primary);
      font-size: 0.74rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .done-btn.watched {
      background: rgba(16, 185, 129, 0.18);
      border-color: rgba(16, 185, 129, 0.45);
      color: #34d399;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(2, 4, 10, 0.82);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      width: 100%;
      max-width: 520px;
      background: #0c111e;
      border: 1px solid var(--border-gold);
      border-radius: 24px;
      padding: 28px;
    }

    .modal-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      margin-top: 6px;
      margin-bottom: 14px;
    }

    .bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 6px;
    }

    .bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.35s ease;
    }
  </style>
</head>

    // 21st.dev Spotlight Card with scroll-triggered reveal motion
    function SpotlightCard({ children, onClick, index = 0 }) {
      const ref = useRef(null);
      const onPointerMove = (e) => {
        if (!ref.current) return;
        const rect = ref.current.getBoundingClientRect();
        ref.current.style.setProperty("--x", `${e.clientX - rect.left}px`);
        ref.current.style.setProperty("--y", `${e.clientY - rect.top}px`);
      };

      return React.createElement(
        motion.div,
        {
          ref,
          onPointerMove,
          onClick,
          initial: { opacity: 0, y: 28, scale: 0.97 },
          whileInView: { opacity: 1, y: 0, scale: 1 },
          viewport: { once: true, amount: "some" },
          transition: { duration: 0.55, delay: index * 0.08, ease: [0.22, 1, 0.36, 1] },
          whileHover: { y: -5, scale: 1.015 },
          whileTap: { scale: 0.985 },
          className: "spotlight-box"
        },
        children
      );
    }

    // =========================================================================
    // THREE.JS: CENTER BAG + 3 COLORED BOOKS EMERGING ON SCROLL (CLEAN STAGE)
    // =========================================================================
    (function initMiddleBagStage() {
      const canvas = document.getElementById("three-center-stage");
      if (!canvas || !window.THREE) return;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0.3, 9.5);

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      scene.add(new THREE.AmbientLight(0xffffff, 0.72));

      const goldLight = new THREE.DirectionalLight(0xffe69c, 1.45);
      goldLight.position.set(4, 7, 8);
      scene.add(goldLight);

      const rimLight = new THREE.DirectionalLight(0x60a5fa, 0.8);
      rimLight.position.set(-5, 2, -4);
      scene.add(rimLight);

      // Center Bag Group right in the middle of the stage
      const centerGroup = new THREE.Group();
      centerGroup.position.set(0, -0.35, 0);
      scene.add(centerGroup);

      const bagMat = new THREE.MeshStandardMaterial({
        color: 0x0e131f,
        roughness: 0.45,
        metalness: 0.22
      });
      const yellowZipMat = new THREE.MeshStandardMaterial({
        color: 0xfacc15,
        roughness: 0.35,
        metalness: 0.15
      });
      const goldMat = new THREE.MeshStandardMaterial({
        color: 0xe5c158,
        roughness: 0.24,
        metalness: 0.86
      });

      const bagBody = new THREE.Mesh(new THREE.BoxGeometry(2.65, 3.05, 1.3), bagMat);
      bagBody.position.y = -0.35;
      centerGroup.add(bagBody);

      const bagPocket = new THREE.Mesh(new THREE.BoxGeometry(2.08, 1.35, 0.34), bagMat);
      bagPocket.position.set(0, -0.95, 0.75);
      centerGroup.add(bagPocket);

      const yellowBand = new THREE.Mesh(new THREE.BoxGeometry(2.14, 0.11, 0.38), yellowZipMat);
      yellowBand.position.set(0, -0.24, 0.75);
      centerGroup.add(yellowBand);

      const topHandle = new THREE.Mesh(
        new THREE.TorusGeometry(0.45, 0.07, 12, 32, Math.PI),
        goldMat
      );
      topHandle.position.set(0, 1.18, -0.15);
      centerGroup.add(topHandle);

      function makeBook(hex, startX) {
        const g = new THREE.Group();
        const cover = new THREE.MeshStandardMaterial({ color: hex, roughness: 0.3, metalness: 0.22 });
        const page = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.75 });

        const front = new THREE.Mesh(new THREE.BoxGeometry(1.48, 2.02, 0.08), cover);
        front.position.z = 0.15;

        const back = new THREE.Mesh(new THREE.BoxGeometry(1.48, 2.02, 0.08), cover);
        back.position.z = -0.15;

        const spine = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.02, 0.36), cover);
        spine.position.x = -0.71;

        const trimTop = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.03, 0.09), goldMat);
        trimTop.position.set(0.04, 0.82, 0.19);

        const trimBot = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.03, 0.09), goldMat);
        trimBot.position.set(0.04, -0.82, 0.19);

        const pages = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.92, 0.24), page);

        g.add(front, back, spine, trimTop, trimBot, pages);
        g.position.set(startX, 0.1, 0);
        return g;
      }

      const books = {
        maths: makeBook(0x3b82f6, -0.52),
        science: makeBook(0x10b981, 0),
        sst: makeBook(0xf59e0b, 0.52)
      };

      Object.values(books).forEach((b) => centerGroup.add(b));

      window.__CENTER_BAG_SCROLL__ = 0;
      window.__SELECTED_BOOK__ = "maths";

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        const s = window.__CENTER_BAG_SCROLL__ || 0;
        const sel = window.__SELECTED_BOOK__ || "maths";

        const isSmall = window.innerWidth < 820;
        centerGroup.scale.setScalar(isSmall ? 0.68 : 0.95);
        centerGroup.position.y = THREE.MathUtils.lerp(-0.35, 0.25, Math.min(s * 1.4, 1));

        // Gentle centered sway + scroll rotation
        centerGroup.rotation.y = Math.sin(t * 0.45) * 0.16 + s * 0.45;
        centerGroup.rotation.x = Math.cos(t * 0.35) * 0.04;

        // Scroll brings the 3 books up and out from the center bag
        const emerge = Math.min(s * 2.5, 1);

        const bookTargets = [
          { key: "maths", x: -0.52 - emerge * 1.65, y: 0.1 + emerge * 1.65, rotZ: 0.1 + emerge * 0.18 },
          { key: "science", x: 0, y: 0.18 + emerge * 1.95, rotZ: 0 },
          { key: "sst", x: 0.52 + emerge * 1.65, y: 0.1 + emerge * 1.65, rotZ: -0.1 - emerge * 0.18 }
        ];

        bookTargets.forEach(({ key, x, y, rotZ }) => {
          const mesh = books[key];
          const active = key === sel;
          const lift = active ? 0.32 : 0;

          mesh.position.x = THREE.MathUtils.lerp(mesh.position.x, x, 0.09);
          mesh.position.y = THREE.MathUtils.lerp(mesh.position.y, y + lift, 0.09);
          mesh.position.z = THREE.MathUtils.lerp(mesh.position.z, active ? 0.55 : 0.05, 0.09);
          mesh.rotation.z = THREE.MathUtils.lerp(mesh.rotation.z, rotZ, 0.09);
          mesh.rotation.y = active ? Math.sin(t * 1.3) * 0.2 : 0;
        });

        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();
  </script>
