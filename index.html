<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STUDYVERSE — CBSE Class 10 Academic Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-obsidian: #06080f;
      --bg-elevated: rgba(13, 18, 30, 0.78);
      --bg-card: rgba(17, 24, 39, 0.72);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-gold: rgba(212, 175, 55, 0.35);
      --gold: #e5c158;
      --gold-soft: rgba(229, 193, 88, 0.14);
      --maths-blue: #3b82f6;
      --science-emerald: #10b981;
      --sst-amber: #f59e0b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: "Cormorant Garamond", Georgia, serif;
      --font-mono: "JetBrains Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-obsidian);
      background-image:
        radial-gradient(circle at 18% 15%, rgba(59, 130, 246, 0.08), transparent 42%),
        radial-gradient(circle at 82% 25%, rgba(229, 193, 88, 0.07), transparent 45%),
        radial-gradient(circle at 50% 85%, rgba(16, 185, 129, 0.07), transparent 50%);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Fullscreen Clean 3D Canvas */
    #three-stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Subtle Film Vignette for Clear Background Depth */
    .ambient-vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 45%, rgba(6, 8, 15, 0.78) 100%);
    }

    /* Top Scroll Progress Bar */
    .scroll-progress-track {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      z-index: 80;
      background: rgba(255, 255, 255, 0.04);
    }

    .scroll-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--maths-blue), var(--gold), var(--science-emerald));
      box-shadow: 0 0 12px rgba(229, 193, 88, 0.65);
    }

    /* Opening Cinematic Video/Sequence Curtain */
    .cinema-curtain {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #04060b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cinema-grid-lines {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(229, 193, 88, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(229, 193, 88, 0.04) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
    }

    .cinema-orb {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(229, 193, 88, 0.16), rgba(59, 130, 246, 0.08) 45%, transparent 70%);
      filter: blur(40px);
    }

    .cinema-letterbox-top,
    .cinema-letterbox-bottom {
      position: absolute;
      left: 0;
      right: 0;
      height: 11vh;
      background: #020306;
      z-index: 2;
    }
    .cinema-letterbox-top { top: 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .cinema-letterbox-bottom { bottom: 0; border-top: 1px solid rgba(255,255,255,0.05); }

    /* Main Content Shell */
    .shell {
      position: relative;
      z-index: 10;
      max-width: 1220px;
      margin: 0 auto;
      padding: 24px 24px 120px;
    }

    /* Editorial Top Navigation */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 22px;
      background: rgba(10, 14, 24, 0.72);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      margin-bottom: 36px;
      position: sticky;
      top: 16px;
      z-index: 50;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-emblem {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid var(--border-gold);
      display: grid;
      place-items: center;
      color: var(--gold);
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 1.25rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .brand-name {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
    }

    .brand-tag {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--gold);
      background: var(--gold-soft);
      border: 1px solid var(--border-gold);
      padding: 3px 9px;
      border-radius: 99px;
      letter-spacing: 0.06em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .nav-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.04);
    }

    .nav-btn.active {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--border-gold);
    }

    .auth-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(229, 193, 88, 0.16), rgba(229, 193, 88, 0.05));
      border: 1px solid var(--border-gold);
      color: var(--gold);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 9px 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .auth-pill:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(229, 193, 88, 0.18);
    }

    /* Hero Section paired with 3D Backpack Stage */
    .hero-section {
      min-height: 78vh;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 32px;
      padding: 20px 0 60px;
    }

    @media (max-width: 920px) {
      .hero-section {
        grid-template-columns: 1fr;
        min-height: auto;
        padding-top: 10px;
      }
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 18px;
    }

    .eyebrow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px var(--gold);
    }

    .hero-title {
      font-size: clamp(2.6rem, 5.4vw, 4.4rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
    }

    .hero-title .serif-accent {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 700;
      color: var(--gold);
      font-size: 1.08em;
    }

    .hero-desc {
      font-size: 1.05rem;
      line-height: 1.65;
      color: var(--text-secondary);
      max-width: 560px;
      margin-bottom: 30px;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn-primary-lux {
      background: linear-gradient(135deg, #f3d06b, #c99e2e);
      color: #090b10;
      border: none;
      padding: 14px 26px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 12px 30px rgba(229, 193, 88, 0.25);
    }

    .btn-ghost-lux {
      background: rgba(15, 23, 42, 0.65);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      padding: 14px 22px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      backdrop-filter: blur(12px);
    }

    /* 3D Backpack Stage Callout Hint */
    .stage-telemetry {
      background: rgba(10, 14, 24, 0.62);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(18px);
      border-radius: 22px;
      padding: 22px;
      align-self: end;
    }

    .telemetry-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--gold);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .book-legend {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.84rem;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .legend-item:hover {
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateX(4px);
    }

    .color-swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      display: inline-block;
      margin-right: 10px;
    }

    /* 21st.dev Spotlight Flash Cards */
    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .section-kicker {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--gold);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .section-title {
      font-size: clamp(1.6rem, 3vw, 2.25rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .spotlight-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
      margin-bottom: 72px;
    }

    .spotlight-card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 24px;
      overflow: hidden;
      backdrop-filter: blur(18px);
      cursor: pointer;
      transition: border-color 0.3s ease;
    }

    .spotlight-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        420px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(229, 193, 88, 0.14),
        transparent 45%
      );
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .spotlight-card:hover::before {
      opacity: 1;
    }

    .spotlight-card:hover {
      border-color: var(--border-gold);
    }

    .card-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      padding: 4px 10px;
      border-radius: 99px;
      margin-bottom: 16px;
    }

    .status-live {
      background: rgba(16, 185, 129, 0.14);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.32);
    }

    .status-soon {
      background: rgba(148, 163, 184, 0.1);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.22);
    }

    /* Interactive 3-Book Shelf (Maths, Science, SST) */
    .books-vault {
      background: rgba(9, 13, 22, 0.82);
      border: 1px solid var(--border-subtle);
      border-radius: 28px;
      padding: 32px;
      backdrop-filter: blur(24px);
      margin-bottom: 72px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.45);
    }

    .books-trio {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }

    @media (max-width: 820px) {
      .books-trio {
        grid-template-columns: 1fr;
      }
    }

    .book-tome {
      position: relative;
      border-radius: 20px;
      padding: 24px;
      text-align: left;
      cursor: pointer;
      background: rgba(15, 22, 36, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .book-tome .spine-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 6px;
    }

    .book-tome.active {
      transform: translateY(-4px);
      background: rgba(20, 29, 48, 0.96);
    }

    .book-tome-meta {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
      opacity: 0.85;
    }

    .book-tome-title {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .book-tome-sub {
      font-size: 0.84rem;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    /* Chapters Grid inside Open Book */
    .chapters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .chapter-pill-card {
      background: rgba(13, 19, 32, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 18px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.25s ease;
    }

    .chapter-pill-card:hover {
      border-color: rgba(255, 255, 255, 0.22);
      transform: translateY(-2px);
    }

    .chapter-pill-card.selected {
      border-color: var(--gold);
      background: linear-gradient(145deg, rgba(229, 193, 88, 0.12), rgba(15, 23, 42, 0.95));
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    /* Curated 3 Videos Showcase */
    .videos-theatre {
      background: rgba(5, 8, 15, 0.88);
      border: 1px solid var(--border-gold);
      border-radius: 22px;
      padding: 24px;
    }

    .videos-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 18px;
    }

    @media (max-width: 900px) {
      .videos-grid-3 {
        grid-template-columns: 1fr;
      }
    }

    .lecture-card {
      background: rgba(14, 20, 34, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .lecture-card:hover {
      transform: translateY(-4px);
      border-color: var(--gold);
    }

    .thumb-frame {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #0b1120;
      overflow: hidden;
    }

    .thumb-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .channel-chip {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(4, 6, 12, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(229, 193, 88, 0.4);
      color: var(--gold);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 99px;
    }

    .lecture-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .lecture-title {
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text-primary);
    }

    .lecture-actions {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .watch-link {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--gold);
      text-decoration: none;
    }

    .mark-done-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-primary);
      font-size: 0.74rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .mark-done-btn.completed {
      background: rgba(16, 185, 129, 0.18);
      border-color: rgba(16, 185, 129, 0.45);
      color: #34d399;
    }

    /* Modal for Auth & Personal Growth Dashboard */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(2, 4, 10, 0.82);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-sheet {
      width: 100%;
      max-width: 540px;
      background: #0c111e;
      border: 1px solid var(--border-gold);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
    }

    .input-field {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-family: var(--font-sans);
      font-size: 0.92rem;
      margin-top: 6px;
      margin-bottom: 14px;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--gold);
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.4s ease;
    }
  </style>
</head>
<body>
  <canvas id="three-stage"></canvas>
  <div class="ambient-vignette"></div>
  <div class="scroll-progress-track"><div class="scroll-progress-fill" id="topScrollFill"></div></div>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    // 21st.dev-inspired Spotlight Card Component
    function SpotlightCard({ children, onClick, className = "" }) {
      const cardRef = useRef(null);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        cardRef.current.style.setProperty("--mouse-x", `${e.clientX - rect.left}px`);
        cardRef.current.style.setProperty("--mouse-y", `${e.clientY - rect.top}px`);
      };

      return React.createElement(
        motion.div,
        {
          ref: cardRef,
          onMouseMove: handleMouseMove,
          onClick,
          whileHover: { y: -5, scale: 1.01 },
          whileTap: { scale: 0.99 },
          transition: { type: "spring", stiffness: 280, damping: 24 },
          className: `spotlight-card ${className}`
        },
        children
      );
    }

    // =========================================================================
    (function initThreeBackpackStage() {
      const canvas = document.getElementById("three-stage");
      if (!canvas || !window.THREE) return;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0.4, 9.5);

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      // Studio Lighting
      const ambient = new THREE.AmbientLight(0xffffff, 0.65);
      scene.add(ambient);

      const keyLight = new THREE.DirectionalLight(0xffe8a3, 1.35);
      keyLight.position.set(5, 8, 7);
      scene.add(keyLight);

      const rimLight = new THREE.DirectionalLight(0x3b82f6, 0.85);
      rimLight.position.set(-6, 3, -5);
      scene.add(rimLight);

      // Master Group positioned cleanly on the right side of the hero
      const stageGroup = new THREE.Group();
      stageGroup.position.set(2.3, -0.3, 0);
      scene.add(stageGroup);

      // 1. Minimalist Luxury 3D Study Bag (Obsidian Leather + Champagne Gold Clasp)
      const bagGroup = new THREE.Group();
      stageGroup.add(bagGroup);

      const leatherMat = new THREE.MeshStandardMaterial({
        color: 0x111726,
        roughness: 0.42,
        metalness: 0.25
      });

      const trimGoldMat = new THREE.MeshStandardMaterial({
        color: 0xe5c158,
        roughness: 0.25,
        metalness: 0.85
      });

      // Main Bag Body
      const bodyGeo = new THREE.BoxGeometry(2.7, 3.1, 1.35);
      const bagBody = new THREE.Mesh(bodyGeo, leatherMat);
      bagBody.position.y = -0.35;
      bagGroup.add(bagBody);

      // Front Pocket
      const pocketGeo = new THREE.BoxGeometry(2.1, 1.45, 0.35);
      const bagPocket = new THREE.Mesh(pocketGeo, leatherMat);
      bagPocket.position.set(0, -0.95, 0.78);
      bagGroup.add(bagPocket);

      // Gold Zipper / Trim Bar
      const zipGeo = new THREE.BoxGeometry(2.14, 0.07, 0.38);
      const bagZip = new THREE.Mesh(zipGeo, trimGoldMat);
      bagZip.position.set(0, -0.25, 0.78);
      bagGroup.add(bagZip);

      // Top Handle
      const handleGeo = new THREE.TorusGeometry(0.45, 0.07, 12, 32, Math.PI);
      const handle = new THREE.Mesh(handleGeo, trimGoldMat);
      handle.position.set(0, 1.2, -0.15);
      bagGroup.add(handle);

      // 2. Three Distinct Colored Books (Maths = Blue, Science = Emerald, SST = Amber)
      function createLuxuryBook(coverHex, xOffset) {
        const book = new THREE.Group();

        const coverMat = new THREE.MeshStandardMaterial({
          color: coverHex,
          roughness: 0.32,
          metalness: 0.2
        });

        const pagesMat = new THREE.MeshStandardMaterial({
          color: 0xf8fafc,
          roughness: 0.75
        });

        // Back & Front Covers
        const coverGeo = new THREE.BoxGeometry(1.55, 2.1, 0.08);
        const frontCover = new THREE.Mesh(coverGeo, coverMat);
        frontCover.position.z = 0.16;

        const backCover = new THREE.Mesh(coverGeo, coverMat);
        backCover.position.z = -0.16;

        // Spine
        const spineGeo = new THREE.BoxGeometry(0.1, 2.1, 0.38);
        const spine = new THREE.Mesh(spineGeo, coverMat);
        spine.position.x = -0.75;

        // Gold Foil Band on Spine
        const foilGeo = new THREE.BoxGeometry(0.11, 0.25, 0.39);
        const foil = new THREE.Mesh(foilGeo, trimGoldMat);
        foil.position.set(-0.75, 0.55, 0);

        // Cream Paper Block
        const pagesGeo = new THREE.BoxGeometry(1.46, 2.0, 0.26);
        const pages = new THREE.Mesh(pagesGeo, pagesMat);

        book.add(frontCover, backCover, spine, foil, pages);
        book.position.set(xOffset, 0.2, 0);
        return book;
      }

      const booksMap = {
        maths: createLuxuryBook(0x3b82f6, -0.55),
        science: createLuxuryBook(0x10b981, 0.0),
        sst: createLuxuryBook(0xf59e0b, 0.55)
      };

      Object.values(booksMap).forEach((b) => stageGroup.add(b));

      window.__SV_SCROLL__ = 0;
      window.__SV_ACTIVE_BOOK__ = "maths";

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        const scroll = window.__SV_SCROLL__ || 0;
        const activeKey = window.__SV_ACTIVE_BOOK__ || "maths";

        // Responsive positioning for mobile vs desktop
        const isMobile = window.innerWidth < 920;
        stageGroup.position.x = isMobile ? 0 : THREE.MathUtils.lerp(2.35, 0, Math.min(scroll * 1.6, 1));
        stageGroup.position.y = isMobile ? -1.4 : -0.25;
        stageGroup.scale.setScalar(isMobile ? 0.72 : 1);

        // Gentle floating motion
        stageGroup.rotation.y = Math.sin(t * 0.45) * 0.22 + scroll * 0.6;
        stageGroup.rotation.x = Math.cos(t * 0.35) * 0.06;

        // As user scrolls, the 3 books emerge smoothly out of the bag and fan apart
        const emerge = Math.min(scroll * 2.4, 1);

        const configs = [
          { key: "maths", targetX: -0.55 - emerge * 1.45, targetY: 0.2 + emerge * 1.55, rotZ: 0.12 + emerge * 0.16 },
          { key: "science", targetX: 0, targetY: 0.25 + emerge * 1.85, rotZ: 0 },
          { key: "sst", targetX: 0.55 + emerge * 1.45, targetY: 0.2 + emerge * 1.55, rotZ: -0.12 - emerge * 0.16 }
        ];

        configs.forEach(({ key, targetX, targetY, rotZ }) => {
          const mesh = booksMap[key];
          const isSelected = key === activeKey;
          const highlightBoost = isSelected ? 0.35 : 0;

          mesh.position.x = THREE.MathUtils.lerp(mesh.position.x, targetX, 0.08);
          mesh.position.y = THREE.MathUtils.lerp(mesh.position.y, targetY + highlightBoost, 0.08);
          mesh.position.z = THREE.MathUtils.lerp(mesh.position.z, isSelected ? 0.55 : 0.05, 0.08);
          mesh.rotation.z = THREE.MathUtils.lerp(mesh.rotation.z, rotZ, 0.08);
          mesh.rotation.y = isSelected ? Math.sin(t * 1.4) * 0.25 : 0;
        });

        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();
  </script>
</body>
</html>
