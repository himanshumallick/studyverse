  <style>
    :root {
      --bg: #030712;
      --surface: rgba(11, 15, 25, 0.86);
      --border: rgba(99, 102, 241, 0.24);
      --cyan: #38bdf8;
      --indigo: #6366f1;
      --violet: #a855f7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --font-sans: "Plus Jakarta Sans", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .scroll-track {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      z-index: 60;
      background: rgba(255, 255, 255, 0.04);
      pointer-events: none;
    }

    .scroll-fill {
      height: 100%;
      width: 100%;
      transform-origin: 0% 50%;
      background: linear-gradient(90deg, var(--cyan), var(--indigo), var(--violet));
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.65);
    }

    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 16% 14%, rgba(56, 189, 248, 0.16), transparent 42%),
        radial-gradient(circle at 84% 22%, rgba(168, 85, 247, 0.15), transparent 44%),
        linear-gradient(to right, rgba(148, 163, 184, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 44px 44px, 44px 44px;
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 1160px;
      margin: 0 auto;
      padding: 28px 20px 88px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 18px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.25rem;
      color: #fff;
    }

    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--cyan), var(--indigo));
      color: #fff;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
    }

    .brand span {
      color: var(--cyan);
    }

    .status-pill {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: var(--cyan);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 12px;
      border-radius: 99px;
    }

    .hero-title {
      font-size: clamp(2rem, 4.2vw, 3.25rem);
      font-weight: 800;
      line-height: 1.12;
      margin-bottom: 8px;
    }

    .grad {
      background: linear-gradient(135deg, var(--cyan), #818cf8, var(--violet));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 24px;
    }

    .class-tabs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .class-tab {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      cursor: pointer;
      color: var(--text);
      font-weight: 700;
      text-align: left;
      overflow: hidden;
    }

    .active-pill-bg {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(99, 102, 241, 0.18));
      border: 1px solid rgba(56, 189, 248, 0.55);
      z-index: 0;
    }

    .tab-inner {
      position: relative;
      z-index: 1;
    }

    .class-num {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: var(--cyan);
    }

    .stream-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .stream-btn {
      position: relative;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(148, 163, 184, 0.22);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      overflow: hidden;
    }

    .stream-active-bg {
      position: absolute;
      inset: 0;
      border-radius: 99px;
      background: linear-gradient(135deg, var(--cyan), var(--indigo));
      z-index: 0;
    }

    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .spotlight-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      cursor: pointer;
      overflow: hidden;
    }

    .spotlight-glow {
      position: absolute;
      inset: -1px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .spotlight-card:hover .spotlight-glow,
    .video-card:hover .spotlight-glow {
      opacity: 1;
    }

    .spotlight-card.active {
      border-color: var(--cyan);
      box-shadow: 0 14px 32px rgba(56, 189, 248, 0.16);
    }

    .chapters-panel {
      background: var(--surface);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 24px;
      padding: 22px;
      backdrop-filter: blur(20px);
    }

    .chapter-card {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .chapter-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .mod-tag {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--cyan);
      font-weight: 700;
    }

    .chapter-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: #fff;
      margin-top: 2px;
    }

    .pdf-pill {
      background: linear-gradient(135deg, var(--cyan), var(--indigo));
      color: #fff;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 10px;
    }

    .videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
      gap: 14px;
    }

    .video-card {
      position: relative;
      background: rgba(3, 7, 18, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }

    .thumb-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #0f172a;
      overflow: hidden;
    }

    .thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .video-card:hover .thumb-img {
      transform: scale(1.06);
    }

    .play-chip {
      position: absolute;
      right: 8px;
      bottom: 8px;
      background: rgba(3, 7, 18, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      opacity: 0.9;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .video-card:hover .play-chip {
      transform: scale(1.06);
      background: var(--cyan);
      color: #030712;
    }

    .rank-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(3, 7, 18, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: var(--cyan);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 99px;
    }

    .video-body {
      position: relative;
      z-index: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .video-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #f8fafc;
      line-height: 1.35;
    }

    .video-meta {
      font-size: 0.73rem;
      color: var(--muted);
      margin-top: auto;
    }
  </style>
</head>

    function useSpotlight() {
      const [pos, setPos] = useState({ x: 0, y: 0 });
      const onMouseMove = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        setPos({ x: e.clientX - rect.left, y: e.clientY - rect.top });
      };
      const glowStyle = {
        background: `radial-gradient(240px circle at ${pos.x}px ${pos.y}px, rgba(56, 189, 248, 0.16), transparent 70%)`
      };
      return { onMouseMove, glowStyle };
    }

    function SubjectTile({ subKey, subVal, isActive, onSelect }) {
      const { onMouseMove, glowStyle } = useSpotlight();
      return React.createElement(
        motion.div,
        {
          key: subKey,
          onMouseMove,
          whileHover: { y: -4, scale: 1.015 },
          whileTap: { scale: 0.98 },
          transition: { type: "spring", stiffness: 380, damping: 25 },
          onClick: onSelect,
          className: `spotlight-card ${isActive ? "active" : ""}`
        },
        React.createElement("div", { className: "spotlight-glow", style: glowStyle }),
        React.createElement("div", { style: { position: "relative", zIndex: 1, fontSize: "1.5rem", marginBottom: "6px" } }, subVal.icon),
        React.createElement("div", { style: { position: "relative", zIndex: 1, fontSize: "1.05rem", fontWeight: 700 } }, subVal.label)
      );
    }

    function VideoTile({ chId, vid }) {
      const { onMouseMove, glowStyle } = useSpotlight();
      return React.createElement(
        motion.a,
        {
          key: `${chId}-${vid.videoId}`,
          href: vid.url,
          target: "_blank",
          rel: "noopener noreferrer",
          onMouseMove,
          whileHover: { y: -5, scale: 1.015 },
          whileTap: { scale: 0.98 },
          transition: { type: "spring", stiffness: 400, damping: 25 },
          className: "video-card"
        },
        React.createElement("div", { className: "spotlight-glow", style: glowStyle }),
        React.createElement(
          "div",
          { className: "thumb-wrap" },
          React.createElement("img", {
            src: `https://img.youtube.com/vi/${vid.videoId}/hqdefault.jpg`,
            alt: vid.title,
            className: "thumb-img",
            loading: "lazy"
          }),
          React.createElement("span", { className: "rank-badge" }, vid.rank),
          React.createElement("span", { className: "play-chip" }, "▶ Watch")
        ),
        React.createElement(
          "div",
          { className: "video-body" },
          React.createElement("div", { className: "video-title" }, vid.title),
          React.createElement("div", { className: "video-meta" }, `${vid.channel} • ${vid.year}`)
        )
      );
    }
