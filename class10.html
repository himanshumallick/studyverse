<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBSE Class 10 Interactive Hub — STUDYVERSE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #030712;
      --surface: rgba(11, 15, 25, 0.86);
      --border: rgba(99, 102, 241, 0.25);
      --cyan: #38bdf8;
      --indigo: #6366f1;
      --violet: #a855f7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --font-sans: "Plus Jakarta Sans", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 21st.dev inspired subtle ambient grid + glow */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 18% 15%, rgba(56, 189, 248, 0.14), transparent 40%),
        radial-gradient(circle at 85% 25%, rgba(99, 102, 241, 0.16), transparent 42%),
        linear-gradient(to right, rgba(148, 163, 184, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 44px 44px, 44px 44px;
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.2rem;
      color: #fff;
      text-decoration: none;
    }

    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--cyan), var(--indigo));
      color: #fff;
    }

    .brand span {
      color: var(--cyan);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .hero-title {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .grad {
      background: linear-gradient(135deg, var(--cyan), #818cf8, var(--violet));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 28px;
    }

    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }

    .subject-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      cursor: pointer;
      backdrop-filter: blur(18px);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .subject-card.active,
    .subject-card:hover {
      border-color: var(--cyan);
      box-shadow: 0 14px 36px rgba(56, 189, 248, 0.14);
    }

    .chapters-panel {
      background: var(--surface);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 24px;
      padding: 24px;
      backdrop-filter: blur(20px);
    }

    .chapter-card {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .chapter-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .mod-tag {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--cyan);
      font-weight: 700;
    }

    .chapter-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      margin-top: 2px;
    }

    .pdf-pill {
      background: linear-gradient(135deg, var(--cyan), var(--indigo));
      color: #fff;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 10px;
    }

    .videos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
    }

    .video-card {
      background: rgba(3, 7, 18, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }

    .thumb-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #0f172a;
      overflow: hidden;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .rank-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(3, 7, 18, 0.86);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: var(--cyan);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 99px;
    }

    .video-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .video-title {
      font-size: 0.86rem;
      font-weight: 700;
      color: #f8fafc;
      line-height: 1.35;
    }

    .video-meta {
      font-size: 0.74rem;
      color: var(--muted);
      margin-top: auto;
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>
  <div id="app"></div>

  <script type="module">
    import React, { useState } from "https://esm.sh/react@18.3.1";
    import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
    import { motion, AnimatePresence } from "https://esm.sh/framer-motion@11.11.11?deps=react@18.3.1,react-dom@18.3.1";

    // Curated Top CBSE Videos (ranked by latest syllabus & clarity, max 3 per chapter; 2 where top 2 are strongest)
    const SYLLABUS_DATA = {
      science: {
        label: "Science",
        icon: "🧪",
        tagline: "Latest CBSE Science chapters with ranked top videos & thumbnails",
        chapters: [
          {
            id: "sci-1",
            name: "Chapter 1: Chemical Reactions and Equations",
            pdfUrl: "#",
            videos: [
              {
                rank: "#1 LATEST CBSE",
                title: "Chemical Reactions & Equations L1 | Class 10 Chemistry | CBSE 2026",
                channel: "Vedantu Master Tamil",
                year: "2025",
                videoId: "BuNa0DuhqJs",
                url: "https://www.youtube.com/watch?v=BuNa0DuhqJs"
              },
              {
                rank: "#2 ANIMATED NCERT",
                title: "Chemical reactions and equations Full chapter in animation | CBSE Class 10",
                channel: "Grade booster",
                year: "2024",
                videoId: "AEyJ0MpddzQ",
                url: "https://www.youtube.com/watch?v=AEyJ0MpddzQ"
              },
              {
                rank: "#3 VISUAL REVISION",
                title: "Chemical reactions and equations Full chapter in animation | NCERT Ch-1",
                channel: "Grade booster",
                year: "2024",
                videoId: "aWkVP_lk0DU",
                url: "https://www.youtube.com/watch?v=aWkVP_lk0DU"
              }
            ]
          },
          {
            id: "sci-9",
            name: "Chapter 9: Light – Reflection and Refraction",
            pdfUrl: "#",
            videos: [
              {
                rank: "#1 QUICK ONE-SHOT",
                title: "CBSE 10 Physics | Light Reflection & Refraction | Full Chapter In Just 15 Minutes",
                channel: "Exam Winner: CBSE Class 10",
                year: "2025",
                videoId: "4YESpXn1i9I",
                url: "https://www.youtube.com/watch?v=4YESpXn1i9I"
              },
              {
                rank: "#2 CONCEPT & DIAGRAMS",
                title: "Light - Reflection & Refraction FULL CHAPTER in Animation | NCERT Science",
                channel: "Grade booster",
                year: "2024",
                videoId: "8iVoxtEYJeM",
                url: "https://www.youtube.com/watch?v=8iVoxtEYJeM"
              }
            ]
          }
        ]
      },
      maths: {
        label: "Mathematics",
        icon: "📐",
        tagline: "Board-focused Maths chapters with top 2-3 high-clarity videos",
        chapters: [
          {
            id: "math-1",
            name: "Chapter 1: Real Numbers",
            pdfUrl: "#",
            videos: [
              {
                rank: "#1 RAPID REVISION",
                title: "Class 10th REAL NUMBERS in 20 Minutes! | Class 10 Maths Rapid Revision",
                channel: "Physics Wallah Foundation",
                year: "2026",
                videoId: "ZCcVfJ8f32E",
                url: "https://www.youtube.com/watch?v=ZCcVfJ8f32E"
              },
              {
                rank: "#2 LATEST LECTURE",
                title: "Real Numbers | Lecture 1 | Class 10 Maths | CBSE 2027",
                channel: "Vedantu Master Tamil",
                year: "2026",
                videoId: "2aXOJnmK70c",
                url: "https://www.youtube.com/watch?v=2aXOJnmK70c"
              },
              {
                rank: "#3 FULL CHAPTER",
                title: "Class 10 CBSE Mathematics | Real Numbers - Full Chapter Revision",
                channel: "Xylem Class 10 CBSE",
                year: "2026",
                videoId: "UpErKfAkrEM",
                url: "https://www.youtube.com/watch?v=UpErKfAkrEM"
              }
            ]
          }
        ]
      },
      sst: {
        label: "Social Science",
        icon: "🌍",
        tagline: "History, Civics, Geography & Economics with ranked CBSE videos",
        chapters: [
          {
            id: "sst-his-1",
            name: "History Ch 1: The Rise of Nationalism in Europe",
            pdfUrl: "#",
            videos: [
              {
                rank: "#1 ONE-SHOT REVISION",
                title: "The Rise of Nationalism in Europe ONE SHOT | Class 10 SST Rapid Revision",
                channel: "Physics Wallah Foundation",
                year: "2026",
                videoId: "xBF9CWzDNmE",
                url: "https://www.youtube.com/watch?v=xBF9CWzDNmE"
              },
              {
                rank: "#2 FULL CHAPTER",
                title: "The Rise of Nationalism in Europe Class 10 Full Chapter",
                channel: "Sunlike study",
                year: "2025",
                videoId: "ksTPzTWUb6o",
                url: "https://www.youtube.com/watch?v=ksTPzTWUb6o"
              },
              {
                rank: "#3 ANIMATED EXPLAINER",
                title: "The Rise of Nationalism in Europe class 10 Full chapter in animation",
                channel: "Grade booster",
                year: "2024",
                videoId: "tsharTRrGTE",
                url: "https://www.youtube.com/watch?v=tsharTRrGTE"
              }
            ]
          }
        ]
      }
    };

    function App() {
      const [selectedSubject, setSelectedSubject] = useState("science");
      const currentSubject = SYLLABUS_DATA[selectedSubject];

      return React.createElement(
        "div",
        { className: "container" },
        React.createElement(
          "header",
          { className: "topbar" },
          React.createElement(
            "a",
            { href: "index.html", className: "brand" },
            React.createElement("div", { className: "brand-badge" }, "⚡"),
            React.createElement("div", null, "STUDY", React.createElement("span", null, "VERSE"))
          ),
          React.createElement("a", { href: "index.html", className: "btn-ghost" }, "← Back to Home")
        ),

        React.createElement(
          motion.div,
          {
            initial: { opacity: 0, y: 16 },
            animate: { opacity: 1, y: 0 },
            transition: { type: "spring", stiffness: 260, damping: 24 }
          },
          React.createElement(
            "h1",
            { className: "hero-title" },
            "CBSE Class 10 ",
            React.createElement("span", { className: "grad" }, "Framer Motion"),
            " Hub"
          ),
          React.createElement(
            "p",
            { className: "subtitle" },
            "Top 2–3 curated CBSE videos per chapter with thumbnails, spring motion & PDF notes."
          )
        ),

        // 21st.dev inspired interactive subject selector cards
        React.createElement(
          "div",
          { className: "subjects-grid" },
          Object.entries(SYLLABUS_DATA).map(([key, item]) =>
            React.createElement(
              motion.div,
              {
                key,
                layoutId: `subj-${key}`,
                whileHover: { y: -5, scale: 1.015 },
                whileTap: { scale: 0.98 },
                transition: { type: "spring", stiffness: 380, damping: 26 },
                onClick: () => setSelectedSubject(key),
                className: `subject-card ${selectedSubject === key ? "active" : ""}`
              },
              React.createElement("div", { style: { fontSize: "1.8rem", marginBottom: "10px" } }, item.icon),
              React.createElement("div", { style: { fontSize: "1.2rem", fontWeight: 700 } }, item.label),
              React.createElement("div", { style: { fontSize: "0.86rem", color: "#94a3b8", marginTop: "6px" } }, item.tagline)
            )
          )
        ),

        // Animated chapters + ranked videos with thumbnails
        React.createElement(
          AnimatePresence,
          { mode: "wait" },
          React.createElement(
            motion.section,
            {
              key: selectedSubject,
              initial: { opacity: 0, y: 18 },
              animate: { opacity: 1, y: 0 },
              exit: { opacity: 0, y: -12 },
              transition: { type: "spring", stiffness: 280, damping: 26 },
              className: "chapters-panel"
            },
            React.createElement(
              "h2",
              { style: { fontSize: "1.4rem", fontWeight: 800, marginBottom: "18px" } },
              `${currentSubject.icon} ${currentSubject.label} — Chapters & Top Videos`
            ),
            currentSubject.chapters.map((ch, idx) =>
              React.createElement(
                motion.div,
                {
                  key: ch.id,
                  initial: { opacity: 0, y: 12 },
                  animate: { opacity: 1, y: 0 },
                  transition: { delay: idx * 0.05, type: "spring", stiffness: 300, damping: 24 },
                  className: "chapter-card"
                },
                React.createElement(
                  "div",
                  { className: "chapter-top" },
                  React.createElement(
                    "div",
                    null,
                    React.createElement("div", { className: "mod-tag" }, `MODULE 0${idx + 1}`),
                    React.createElement("div", { className: "chapter-title" }, ch.name)
                  ),
                  React.createElement(
                    "a",
                    {
                      href: ch.pdfUrl,
                      target: "_blank",
                      rel: "noopener noreferrer",
                      className: "pdf-pill"
                    },
                    "📥 PDF Notes"
                  )
                ),
                React.createElement(
                  "div",
                  { className: "videos-grid" },
                  ch.videos.slice(0, 3).map((vid) =>
                    React.createElement(
                      motion.a,
                      {
                        key: vid.videoId,
                        href: vid.url,
                        target: "_blank",
                        rel: "noopener noreferrer",
                        whileHover: { y: -4, scale: 1.015 },
                        whileTap: { scale: 0.98 },
                        transition: { type: "spring", stiffness: 400, damping: 25 },
                        className: "video-card"
                      },
                      React.createElement(
                        "div",
                        { className: "thumb-wrap" },
                        React.createElement("img", {
                          src: `https://img.youtube.com/vi/${vid.videoId}/hqdefault.jpg`,
                          alt: vid.title,
                          loading: "lazy"
                        }),
                        React.createElement("span", { className: "rank-badge" }, vid.rank)
                      ),
                      React.createElement(
                        "div",
                        { className: "video-body" },
                        React.createElement("div", { className: "video-title" }, vid.title),
                        React.createElement("div", { className: "video-meta" }, `${vid.channel} • ${vid.year}`)
                      )
                    )
                  )
                )
              )
            )
          )
        )
      );
    }

    createRoot(document.getElementById("app")).render(React.createElement(App));
  </script>
</body>
</html>
